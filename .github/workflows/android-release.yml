name: Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Expo SDK 57 is validated against the active Node 20 LTS line.
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify Node and native module resolution
        run: |
          set -o pipefail
          node --version
          npm --version
          node --print "require.resolve('react-native/package.json')"
          node --print "require.resolve('llama.rn/package.json')"
          npx expo config --type public
          npx expo-modules-autolinking resolve --platform android --json

      - name: Require production signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/aura-release.keystore"
          printf '\n' >> "$GITHUB_WORKSPACE/android/gradle.properties"
          {
            echo "AURA_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/android/aura-release.keystore"
            echo "AURA_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AURA_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "AURA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_WORKSPACE/android/gradle.properties"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: auraai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AURA AI v${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
